name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Python береться з requires-python / .python-version у проєкті.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright strict)
        run: uv run pyright

      - name: Tests
        run: uv run pytest --cov

      - name: Benchmarks (pytest-benchmark)
        run: >
          uv run pytest tests/perf/test_benchmarks.py --benchmark-enable --benchmark-only
          --benchmark-columns=min,median,mean,rounds --benchmark-json=benchmark.json

      - name: Save benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
