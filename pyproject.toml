[project]
name = "findex"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yeva Bykova", email = "ieva.bykova@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 вимкнено: у проєкті багато довгих коментарів українською, їх не переносимо.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: повільні тести (реальний корпус); пропусти їх через -m 'not slow'"]

[tool.coverage.run]
source = ["findex"]
# Одноразові скрипти вимірювань з Лаб 1–3 (запускаються руками, друкують таблиці для README).
# Їх не покриваємо тестами навмисно: вони виконуються й дають числа, а не логіку для перевірки.
omit = [
    "src/findex/__main__.py",
    "src/findex/benchmark.py",
    "src/findex/memory_benchmark.py",
    "src/findex/serialize_benchmark.py",
    "src/findex/ranking_checks.py",
]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
